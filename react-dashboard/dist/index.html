    <!-- PWA / fullscreen on home screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="manifest" href="/react/manifest.json" />

    <title>Aurora — Lightweight Smart Home</title>
    <script>document.documentElement.setAttribute('data-theme', new URLSearchParams(location.search).get('theme') || localStorage.getItem('lsh-theme') || 'dark')</script>
    <!-- User-authored overrides (Settings → Custom CSS) — loaded as a real
         stylesheet, not fetched+injected via JS, so it applies before first
         paint instead of flashing unstyled then restyled. -->
    <link rel="stylesheet" href="/custom.css" />
    <script type="module" crossorigin src="/react/assets/index-DFGLSgmO.js"></script>
