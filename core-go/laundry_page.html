<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Laundry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e9; --bg2:#efe7da; --card:#fffdf9; --ink:#23201b; --sub:#8a7f6e;
    --line:#e6ddcd; --accent:#9a7b34; --accent-ink:#fff8ec;
    --gold:#b7935a; --good:#5a7d4f; --bad:#b4442f;
    --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#15130f; --bg2:#1c1915; --card:#201c17; --ink:#f3ece0; --sub:#a99d88;
           --line:#322c23; --accent:#caa158; --accent-ink:#1a1611; --gold:#d8b878; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(120% 60% at 50% 0,var(--bg2),var(--bg) 60%);background-attachment:fixed}
  main{max-width:600px;margin:0 auto;padding:0 20px 150px}
  header{text-align:center;padding:40px 10px 24px}
  .crest{width:40px;height:1px;background:var(--gold);margin:0 auto 18px;position:relative}
  .crest::before{content:"◆";position:absolute;top:-10px;left:50%;transform:translateX(-50%);
    color:var(--gold);font-size:12px;background:var(--bg);padding:0 8px}
  h1{font-family:var(--serif);font-size:40px;font-weight:600;letter-spacing:.01em;margin:0;line-height:1.05}
  .room{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--sub);margin-top:12px}
  .lead{color:var(--sub);font-size:14px;font-style:italic;margin-top:10px}
  .cat{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--gold);
    margin:34px 2px 14px;display:flex;align-items:center;gap:14px}
  .cat::after{content:"";flex:1;height:1px;background:var(--line)}
  .item{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
  .item .info{flex:1;min-width:0}
  .item .name{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.1}
  .item .desc{color:var(--sub);font-size:13.5px;margin-top:3px;font-style:italic}
  .item .price{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--gold);
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .stepper{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .stepper button{width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:19px;line-height:1;
    background:transparent;color:var(--gold);border:1px solid var(--gold);transition:.15s}
  .stepper button.plus{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .stepper button:active{transform:scale(.92)}
  .stepper .q{min-width:16px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
  .hidden{display:none !important}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:14px 20px calc(16px + env(safe-area-inset-bottom));
    background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px) saturate(1.3);
    border-top:1px solid var(--line)}
  .bar .inner{max-width:600px;margin:0 auto}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;
    border-radius:12px;padding:17px;font-size:15px;font-weight:600;letter-spacing:.04em;cursor:pointer;
    background:var(--accent);color:var(--accent-ink);font-family:var(--sans)}
  .btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn[disabled]{opacity:.5}
  .btn+.btn{margin-top:10px}
  .total{font-variant-numeric:tabular-nums}
  .sheet-bg{position:fixed;inset:0;background:rgba(25,18,8,.5);backdrop-filter:blur(3px);
    display:flex;align-items:flex-end;z-index:20}
  .sheet{background:var(--bg);width:100%;max-width:600px;margin:0 auto;border-radius:22px 22px 0 0;
    padding:26px 20px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;
    border-top:2px solid var(--gold)}
  .sheet h2{font-family:var(--serif);font-weight:600;margin:0 0 16px;font-size:28px;text-align:center}
  label,.label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);margin:16px 2px 6px;font-weight:600}
  input[type=text],textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:10px;padding:13px;font-size:16px;font-family:inherit}
  input:focus,textarea:focus{outline:none;border-color:var(--gold)}
  .lines{border-top:1px solid var(--line)}
  .line{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
  .line .q{color:var(--gold);margin-right:10px;font-variant-numeric:tabular-nums}
  .sumline{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--serif);
    font-size:24px;font-weight:600;padding:14px 2px 6px}
  .sumline span:last-child{color:var(--gold)}
  .choices{display:grid;gap:8px}
  .choices.two{grid-template-columns:1fr 1fr}
  .choice{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;
    padding:12px 13px;cursor:pointer;font:inherit;min-height:48px}
  .choice[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .choice b{display:block;font-weight:600}
  .choice small{color:var(--sub);font-size:12.5px}
  .track{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  .track .head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .track .state{font-family:var(--serif);font-size:22px;font-weight:600}
  .track .eta{color:var(--sub);font-size:13px;margin-top:2px}
  .track .what{color:var(--sub);font-size:13.5px;margin-top:10px}
  .steps{display:flex;gap:4px;margin-top:12px}
  .steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
  .steps i.on{background:var(--accent)}
  .track.cancelled .state{color:var(--bad)}
  .msg{text-align:center;padding:30px 16px}
  .msg .big{font-family:var(--serif);font-size:52px;color:var(--gold);line-height:1}
  .msg h2{font-family:var(--serif);font-size:30px;margin:14px 0 8px}
  .msg p{color:var(--sub);margin:0}
  .err{color:var(--bad);text-align:center;font-size:14px;margin-top:12px;min-height:18px}
</style></head>
<body><main>
  <header>
    <div class="crest"></div>
    <h1 id="title">Laundry</h1>
    <div class="room" id="room-label"></div>
    <div class="lead" id="lead"></div>
  </header>
  <div id="tracking"></div>
  <div id="menu"></div>
  <div id="empty" class="msg hidden"><div class="big">🧺</div><h2>Laundry unavailable</h2>
    <p>The laundry service isn’t available right now.</p></div>
</main>

<div class="bar hidden" id="cartbar"><div class="inner">
  <button class="btn" id="review"><span id="cart-count"></span> · <span class="total" id="cart-total"></span></button>
</div></div>

<div class="sheet-bg hidden" id="checkout"><div class="sheet">
  <h2>Your laundry</h2>
  <div class="lines" id="co-lines"></div>
  <div id="service-wrap">
    <div class="label">Service</div>
    <div class="choices two" id="service"></div>
  </div>
  <div class="label">Pickup</div>
  <div class="choices" id="slots"></div>
  <label for="room">Room</label>
  <input id="room" type="text" placeholder="e.g. 101" autocomplete="off">
  <label for="note">Note (optional)</label>
  <textarea id="note" rows="2" placeholder="Stains, delicate fabrics, starch…"></textarea>
  <div class="sumline"><span>Total</span><span class="total" id="co-total"></span></div>
  <div class="err" id="err"></div>
  <button class="btn" id="submit">Request pickup · added to room bill</button>
  <button class="btn sec" id="co-cancel">Back</button>
</div></div>

<div class="sheet-bg hidden" id="done"><div class="sheet"><div class="msg">
  <div class="big">🧺</div>
  <h2>Pickup requested</h2>
  <p id="done-text"></p>
  <button class="btn" id="done-ok" style="margin-top:24px">Done</button>
</div></div></div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var STORE='lsh-laundry-orders';
  var STEPS=['requested','collected','cleaning','ready','delivered'];
  var LABEL={requested:'Pickup requested',collected:'Collected',cleaning:'Being cleaned',ready:'Ready',delivered:'Returned to your room',cancelled:'Cancelled'};
  var cfg=null, cart={}, express=false, slot='';
  var params=new URLSearchParams(location.search);
  var room=params.get('room')||decodeURIComponent((location.pathname.match(/^\/laundry\/(.+)$/)||[])[1]||'');

  function money(n){ return new Intl.NumberFormat(undefined,{style:'currency',currency:cfg.currency}).format(n); }
  function count(){ return Object.values(cart).reduce(function(a,b){return a+b},0); }
  function subtotal(){ var t=0; cfg.items.forEach(function(i){ t+=(cart[i.id]||0)*i.price }); return Math.round(t*100)/100; }
  function surcharge(){ return express?Math.round(subtotal()*cfg.express.surchargePct)/100:0; }
  function total(){ return Math.round((subtotal()+surcharge())*100)/100; }
  function lines(){ return cfg.items.filter(function(i){return cart[i.id]}).map(function(i){return {id:i.id,name:i.name,price:i.price,qty:cart[i.id]}}); }
  function hours(n){ return n<48?n+(n===1?' hour':' hours'):Math.round(n/24)+' days'; }
  function when(ms){ return new Date(ms).toLocaleString(undefined,{weekday:'short',hour:'2-digit',minute:'2-digit'}); }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}); }

  // Browser storage can throw (private windows); tracking is a convenience.
  function readIds(){ try{ var a=JSON.parse(localStorage.getItem(STORE)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
  function writeIds(a){ try{ localStorage.setItem(STORE,JSON.stringify(a.slice(0,10))); }catch(e){} }

  fetch('/api/order/laundry/menu').then(function(r){ if(!r.ok) throw 0; return r.json() })
    .then(function(j){ cfg=j.data; render(); track(); setInterval(track,30000); })
    .catch(function(){ $('#menu').classList.add('hidden'); $('#empty').classList.remove('hidden'); });

  function render(){
    if(cfg.title){ $('#title').textContent=cfg.title; document.title=cfg.title; }
    if(room) $('#room-label').textContent='Room '+room;
    $('#lead').textContent='Returned within '+hours(cfg.standardHours)+(cfg.express.enabled?' · Express in '+hours(cfg.express.hours):'');
    var cats={}, order=[];
    cfg.items.forEach(function(i){ var c=i.category||'Garments'; if(!cats[c]){cats[c]=[];order.push(c)} cats[c].push(i); });
    var html='';
    order.forEach(function(c){
      html+='<div class="cat">'+esc(c)+'</div>';
      cats[c].forEach(function(i){
        html+='<div class="item" data-id="'+esc(i.id)+'"><div class="info"><div class="name">'+esc(i.name)+'</div>'+
          (i.desc?'<div class="desc">'+esc(i.desc)+'</div>':'')+'</div>'+
          '<div class="price">'+money(i.price)+'</div>'+
          '<div class="stepper"><button class="minus" aria-label="Remove">−</button>'+
          '<span class="q">0</span><button class="plus" aria-label="Add">+</button></div></div>';
      });
    });
    $('#menu').innerHTML=html;
    $('#menu').addEventListener('click',function(e){
      var it=e.target.closest('.item'); if(!it) return; var id=it.getAttribute('data-id');
      if(e.target.classList.contains('plus')) cart[id]=Math.min(99,(cart[id]||0)+1);
      else if(e.target.classList.contains('minus')) cart[id]=Math.max(0,(cart[id]||0)-1);
      else return;
      if(!cart[id]) delete cart[id];
      it.querySelector('.q').textContent=cart[id]||0;
      updateBar();
    });
    slot=cfg.pickupSlots[0];
  }
  function updateBar(){
    var n=count();
    if(n){ $('#cartbar').classList.remove('hidden'); $('#cart-count').textContent=n+(n===1?' item':' items'); $('#cart-total').textContent=money(total()); }
    else $('#cartbar').classList.add('hidden');
  }

  function renderSheet(){
    var h='';
    lines().forEach(function(x){ h+='<div class="line"><span><span class="q">'+x.qty+'×</span>'+esc(x.name)+'</span><span>'+money(x.price*x.qty)+'</span></div>'; });
    if(express&&surcharge()) h+='<div class="line"><span>Express +'+cfg.express.surchargePct+'%</span><span>'+money(surcharge())+'</span></div>';
    $('#co-lines').innerHTML=h;
    $('#co-total').textContent=money(total());
    $('#service-wrap').classList.toggle('hidden',!cfg.express.enabled);
    $('#service').innerHTML=
      '<button type="button" class="choice" data-express="0" aria-pressed="'+!express+'"><b>Standard</b><small>'+hours(cfg.standardHours)+'</small></button>'+
      '<button type="button" class="choice" data-express="1" aria-pressed="'+express+'"><b>Express</b><small>'+hours(cfg.express.hours)+(cfg.express.surchargePct?' · +'+cfg.express.surchargePct+'%':'')+'</small></button>';
    $('#slots').innerHTML=cfg.pickupSlots.map(function(s,i){
      return '<button type="button" class="choice" data-slot="'+i+'" aria-pressed="'+(s===slot)+'">'+esc(s)+'</button>';
    }).join('');
  }
  $('#service').addEventListener('click',function(e){
    var b=e.target.closest('[data-express]'); if(!b) return;
    express=b.getAttribute('data-express')==='1'; renderSheet(); updateBar();
  });
  $('#slots').addEventListener('click',function(e){
    var b=e.target.closest('[data-slot]'); if(!b) return;
    slot=cfg.pickupSlots[+b.getAttribute('data-slot')]; renderSheet();
  });

  $('#review').addEventListener('click',function(){
    renderSheet();
    if(room) $('#room').value=room;
    $('#err').textContent='';
    $('#checkout').classList.remove('hidden');
  });
  $('#co-cancel').addEventListener('click',function(){ $('#checkout').classList.add('hidden'); });

  $('#submit').addEventListener('click',function(){
    var b=this; b.disabled=true; $('#err').textContent='';
    fetch('/api/order/laundry/place',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({room:$('#room').value.trim(),items:lines(),express:express,pickup:slot,note:$('#note').value})})
      .then(function(r){ return r.json().then(function(j){ if(!r.ok||!j.success) throw new Error(j.error||'Request failed'); return j.data; }); })
      .then(function(d){
        b.disabled=false;
        writeIds([d.id].concat(readIds()));
        $('#checkout').classList.add('hidden');
        $('#done-text').textContent=money(d.total)+' will be added to your room bill. Please leave your laundry bag by the door.';
        $('#done').classList.remove('hidden');
        cart={}; express=false; $('#note').value=''; updateBar();
        document.querySelectorAll('.item .q').forEach(function(q){ q.textContent='0'; });
        track();
      })
      .catch(function(e){ $('#err').textContent=e.message; b.disabled=false; });
  });
  $('#done-ok').addEventListener('click',function(){ $('#done').classList.add('hidden'); });

  // Shows orders placed from this device, until a day after they finish.
  function track(){
    var ids=readIds();
    Promise.all(ids.map(function(id){
      return fetch('/api/order/laundry/status/'+encodeURIComponent(id))
        .then(function(r){ if(r.status===404) return {gone:id}; if(!r.ok) throw 0; return r.json().then(function(j){return j.data}); })
        .catch(function(){ return {keep:id}; });
    })).then(function(rows){
      var now=Date.now(), html='', keep=[];
      rows.forEach(function(o){
        if(o.gone) return;
        if(o.keep){ keep.push(o.keep); return; }
        var finished=o.status==='delivered'||o.status==='cancelled';
        var last=(o.history||[])[(o.history||[]).length-1];
        if(finished&&last&&now-last.at>86400000) return;
        keep.push(o.id);
        var at=STEPS.indexOf(o.status), bars=STEPS.map(function(s,i){ return '<i class="'+(i<=at?'on':'')+'"></i>'; }).join('');
        html+='<div class="track '+esc(o.status)+'"><div class="head"><div class="state">'+esc(LABEL[o.status]||o.status)+'</div>'+
          '<div class="total">'+money(o.total)+'</div></div>'+
          (finished?'':'<div class="eta">Expected by '+esc(when(o.dueAt))+(o.express?' · Express':'')+'</div>')+
          (o.status==='cancelled'?'':'<div class="steps">'+bars+'</div>')+
          '<div class="what">'+esc((o.items||[]).map(function(i){return i.qty+'× '+i.name}).join(', '))+'</div></div>';
      });
      writeIds(keep);
      $('#tracking').innerHTML=html;
    });
  }
})();
</script>
</body></html>
